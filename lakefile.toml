name = "gsh"
version = "0.1.0"
defaultTargets = ["GSH", "GSHTest"]

[leanOptions]
autoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "GSH"

# Built by `lake build`, not only by `scripts/check.sh`. The axiom audit is
# the strongest gate in the repository and it used to run only from the shell
# script, so `lake build` alone reported success with the audit unexecuted.
[[lean_lib]]
name = "GSHTest"
